# Runs the end-to-end check in Chromium, WebKit (Safari's engine), and Firefox.
# Separate from the deploy workflow, so a browser hiccup never blocks publishing.
name: Browser check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or PR cancels the older run instead of
# finishing it, so quick fix-up pushes don't pile up runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # A run takes about 2 minutes. Stop a hung one long before the 6-hour default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps ${{ matrix.browser }}
      - run: npm run e2e
        env:
          BROWSER: ${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.browser }}
          path: screenshots/
          retention-days: 7
