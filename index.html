<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Pick the theme before anything paints (light unless the student chose dark).
      // src/ui/theme.ts owns the toggle; keep the key and default in sync with it.
      (function () {
        var t = 'light';
        try {
          var saved = localStorage.getItem('netlab:v1:theme');
          if (saved === 'light' || saved === 'dark') t = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <style>
      /* Until styles.css arrives: page color and native controls match the theme (same as --bg). */
      html { color-scheme: light; background: #e8ecf2; }
      html[data-theme='dark'] { color-scheme: dark; background: #0e0e0e; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>NetLab</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>NetLab needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
